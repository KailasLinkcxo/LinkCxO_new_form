:root {

* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { background:var(--bg); color:var(--text); font-family:'Outfit',sans-serif; display:flex; flex-direction:column; }

.top-bar { height:var(--header-h); background:var(--surface); border-bottom:2px solid var(--gold); display:flex; align-items:center; padding:0 28px; gap:20px; position:sticky; top:0; z-index:100; box-shadow:0 1px 8px rgba(0,0,0,0.06); }
.logo-mark { font-size:17px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; }
.logo-mark span { color:var(--gold); }
.top-bar-divider { width:1px; height:28px; background:var(--border); }
.top-bar-title { font-size:13px; font-weight:500; color:var(--text-muted); flex:1; }
.top-bar-date { font-family:'DM Mono',monospace; font-size:11px; color:var(--text-dim); }

.app-body { display:flex; flex:1; overflow:hidden; }

.sidenav { width:var(--nav-w); background:var(--gold-dark); display:flex; flex-direction:column; padding:20px 12px; gap:4px; overflow-y:auto; flex-shrink:0; }
.nav-section-label { font-size:9px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.35); padding:8px 10px 4px; margin-top:8px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:400; color:rgba(255,255,255,0.65); transition:all 0.15s; border:1px solid transparent; user-select:none; }
.nav-item:hover { background:rgba(255,255,255,0.10); color:rgba(255,255,255,0.9); }
.nav-item.active { background:var(--gold); color:#ffffff; font-weight:600; border-color:rgba(255,255,255,0.15); }
.nav-icon { width:18px; height:18px; flex-shrink:0; opacity:0.7; }
.nav-item.active .nav-icon { opacity:1; }

.main { flex:1; overflow-y:auto; padding:40px; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
.page { animation:fadeIn 0.3s ease; }

.page-header { margin-bottom:40px; }
.page-header h1 { font-size:28px; font-weight:600; color:var(--text); margin-bottom:8px; letter-spacing:-0.5px; }
.page-header p { font-size:14px; color:var(--text-dim); font-weight:400; }

.section-header { font-size:11px; font-weight:600; color:var(--text-muted); margin:56px 0 20px 0; letter-spacing:0.12em; text-transform:uppercase; }
.section-header:first-of-type { margin-top:0; }

.row-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:32px; }
.row-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:32px; }
.row-4 { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:32px; }
.row-5 { display:grid; grid-template-columns:repeat(5,1fr); gap:20px; margin-bottom:32px; }

.kpi { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:22px 18px; position:relative; transition:all 0.2s; }
.kpi:hover { border-color:rgba(201,169,97,0.25); box-shadow:0 2px 12px rgba(0,0,0,0.02); }
.kpi-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.12em; color:#95a5a6; margin-bottom:10px; }
.kpi-val { font-size:32px; font-weight:400; color:#2d3436; line-height:1.2; margin-bottom:6px; letter-spacing:-0.2px; font-family:'DM Mono',monospace; font-variant-numeric:tabular-nums; }
.kpi-sub { font-size:12px; font-weight:400; color:#b2bec3; display:flex; align-items:center; gap:6px; margin-top:4px; }
.kpi-sub.up { color:var(--green); }
.kpi-sub.down { color:var(--red); }

.chart-box { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px; }
.chart-hdr { font-size:13px; font-weight:600; color:var(--text); margin-bottom:18px; letter-spacing:-0.1px; }
.chart-wrap { position:relative; height:280px; }

.smol-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; }
.smol-card { background:var(--surface); border:1px solid var(--border); padding:16px; border-radius:8px; border-left:3px solid var(--gold); transition:all 0.15s; }
.smol-card:hover { border-left-color:var(--gold-dark); box-shadow:0 2px 6px rgba(0,0,0,0.02); }
.smol-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em; color:#95a5a6; margin-bottom:8px; }
.smol-val { font-size:22px; font-weight:400; color:#2d3436; letter-spacing:-0.2px; font-family:'DM Mono',monospace; font-variant-numeric:tabular-nums; }

table { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; border-collapse:separate; border-spacing:0; margin-bottom:32px; }
thead { background:var(--surface2); }
th { padding:12px 18px; text-align:left; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); border-bottom:1px solid var(--border); }
td { padding:14px 18px; font-size:14px; border-bottom:1px solid rgba(0,0,0,0.02); color:var(--text-muted); font-family:'DM Mono',monospace; font-variant-numeric:tabular-nums; }
tbody tr { transition:background 0.12s; }
tbody tr:hover { background:var(--surface2); }
tbody tr:last-child td { border-bottom:none; }
td:first-child { font-family:'Outfit',sans-serif; }
td.text-col { font-family:'Outfit',sans-serif; }

.expand-btn { background:var(--gold); color:#fff; border:none; padding:10px 20px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; font-family:'Outfit',sans-serif; transition:all 0.2s; margin-bottom:20px; }
.expand-btn:hover { background:var(--gold-dark); transform:translateY(-1px); box-shadow:0 4px 12px rgba(201,169,97,0.3); }
.expand-btn:active { transform:translateY(0); }

.expandable { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
.expandable.open { max-height:5000px; }

.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; }
.modal.open { display:flex; }
.modal-content { background:var(--surface); border-radius:12px; max-width:900px; max-height:80vh; overflow-y:auto; padding:32px; margin:20px; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid var(--border); }
.modal-title { font-size:20px; font-weight:600; }
.modal-close { background:none; border:none; font-size:28px; cursor:pointer; color:var(--text-dim); line-height:1; padding:0; width:32px; height:32px; border-radius:50%; transition:all 0.2s; }

.mobile-nav-overlay { display:none; position:fixed; top:var(--header-h); left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:89; opacity:0; transition:opacity 0.3s; }

@media (max-width:900px) { .hamburger { display:flex; } }

let charts = {};

function destroyCharts() { Object.keys(charts).forEach(id => { if(charts[id]) { charts[id].destroy(); delete charts[id]; } }); }
function mkChart(id,cfg) { const el=document.getElementById(id); if(!el)return; const ctx=el.getContext('2d'); if(charts[id])charts[id].destroy(); charts[id]=new Chart(ctx,cfg); }
function fmt(n) { return n.toLocaleString(); }
function pct(n) { return n.toFixed(1)+'%'; }
function pct2(n) { return n.toFixed(2)+'%'; }

function calc(d) {
  return {
    linkedinCTR: (d.linkedin.clicks / d.linkedin.impressions * 100),
    emailCTR: (d.email.clicks / d.email.views * 100),
    engagement: d.linkedin.likes + d.linkedin.comments + d.linkedin.reposts,
    engagementRate: ((d.linkedin.likes + d.linkedin.comments + d.linkedin.reposts) / d.linkedin.impressions * 100),
    avgEngPerPost: ((d.linkedin.likes + d.linkedin.comments + d.linkedin.reposts) / d.linkedin.posts),
    dailyCTR: d.linkedin.dailyClicks.map((c,i) => (c / d.linkedin.dailyImpressions[i] * 100))
  };
}

function getChange(week,metric) {
  const curr = data[week];
  const prev = week==='week4' ? data.week3 : null;
  if(!prev) return {v:0,c:'',s:''};
  let cv,pv;
  if(metric==='impr') { cv=curr.linkedin.impressions; pv=prev.linkedin.impressions; }
  else if(metric==='clk') { cv=curr.linkedin.clicks; pv=prev.linkedin.clicks; }
  else if(metric==='open') { cv=curr.email.openRate; pv=prev.email.openRate; }
  else if(metric==='user') { cv=curr.users.newUsers; pv=prev.users.newUsers; }
  else return {v:0,c:'',s:''};
  const chg = ((cv-pv)/pv)*100;
  return { v:chg, c:chg>0?'up':chg<0?'down':'', s:chg>0?'↑ ':chg<0?'↓ ':'' };
}

        <div class="video-name">${v.name}</div>
        <div class="video-org">${v.org}</div>
        <div class="video-note">${v.note}</div>
      </div>`;
    });
    html += '</div>';
  }
  
  if(d.videosPending && d.videosPending.length > 0) {
    html += '<div class="video-list"><div class="video-status-label">Pending (' + d.videosPending.length + ')</div>';
    d.videosPending.forEach(v => {
      html += `<div class="video-item">
        <div class="video-name">${v.name}</div>
        <div class="video-org">${v.org}</div>
        <div class="video-note">${v.note}</div>
      </div>`;
    });
    html += '</div>';
  }
  
  document.getElementById('videoModalContent').innerHTML = html;
  document.getElementById('videoModal').classList.add('open');
}

function closeVideoModal() {
  document.getElementById('videoModal').classList.remove('open');
}

function showPage(id,nav) {
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  if(nav)nav.classList.add('active');
  destroyCharts();
  if(id==='week3'||id==='week4') renderWeek(id);
  else if(id==='2week') render2Week();
  else if(id==='comparison') renderCompare();
  else if(id==='monthly') renderMonthly();
}

function toggleMobileNav() {

}

function closeMobileNav() {
